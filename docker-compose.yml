services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - '8080:80'
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: node:20-alpine
    command: sh -c "echo 'Backend placeholder' && tail -f /dev/null"
    ports:
      - '3001:3001'
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/vaultx
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vaultx
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  hardhat:
    image: node:20-alpine
    working_dir: /app/packages/contracts
    volumes:
      - .:/app
    command: sh -c "npm install -g pnpm && pnpm install && npx hardhat node --hostname 0.0.0.0"
    ports:
      - '8545:8545'

volumes:
  postgres_data:
